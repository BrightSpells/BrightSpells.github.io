{{- $name := .Get "name" -}}
{{- $ext := .Get "ext" | default "png" -}}
{{- $title := .Get "title" | default $name -}}
{{- $width := .Get "width" | default 20 -}}
{{- $height := .Get "height" | default 20 -}}
<img src="/emojis/{{ $name }}.{{ $ext }}" title="{{ $title }}" alt="emoji: {{ $name }}" width="{{ $width }}" height="{{ $height }}" class="blobmoji" onerror="this.src='/emojis/{{ $name }}.gif';" />{{- "\u2060" -}}
